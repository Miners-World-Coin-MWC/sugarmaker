name: Sugarmaker CI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'contrib/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    env:
      MAKEJOBS: "-j3"

    strategy:
      fail-fast: false
      matrix:
        include:
          # ============================================================
          # LINUX
          # ============================================================

          # Native x86_64
          - name: x86_64-linux
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            native: true

          # 32-bit x86 (cross via multilib)
          - name: i686-linux
            os: ubuntu-22.04
            platform: linux
            arch: i686
            native: false
            cross_host: i686-linux-gnu

          # ARMv7 / 32-bit ARM (cross)
          - name: armv7l-linux
            os: ubuntu-22.04
            platform: linux
            arch: armv7l
            native: false
            cross_host: arm-linux-gnueabihf

          # ARM64 (cross, on an x86_64 runner)
          - name: aarch64-linux
            os: ubuntu-22.04
            platform: linux
            arch: aarch64
            native: false
            cross_host: aarch64-linux-gnu

          # ARM64 (native runner, no cross toolchain needed)
          - name: aarch64-linux-native
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            native: true

          # RISC-V 64 (cross)
          - name: riscv64-linux
            os: ubuntu-22.04
            platform: linux
            arch: riscv64
            native: false
            cross_host: riscv64-linux-gnu

          # ============================================================
          # MACOS
          # ============================================================

          - name: x86_64-macos
            os: macos-15-intel
            platform: macos
            arch: x86_64
            host: x86_64-apple-darwin

          - name: arm64-macos
            os: macos-latest
            platform: macos
            arch: arm64
            host: arm64-apple-darwin

          # ============================================================
          # WINDOWS
          # ============================================================

          - name: x86_64-win
            os: windows-latest
            platform: windows
            arch: x86_64
            msystem: MINGW64

          # 32-bit Windows: MSYS2 dropped mingw-w64-i686-* packages, so this
          # is cross-compiled from a Linux runner using apt's mingw-w64
          # toolchain + the project's own depends/deps-win32 static libs,
          # matching what build_scripts/build-w32.sh already expects.
          - name: i686-win
            os: ubuntu-22.04
            platform: win32-cross
            arch: i686

          - name: arm64-win
            os: windows-11-arm
            platform: windows
            arch: arm64
            msystem: CLANGARM64

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # LINUX - NATIVE DEPS
      # ============================================================
      - name: Install Linux native dependencies
        if: matrix.platform == 'linux' && matrix.native == true
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libcurl4-openssl-dev libjansson-dev libssl-dev libgmp-dev

      # ============================================================
      # LINUX - CROSS TOOLCHAINS
      # ============================================================
      - name: Install Linux cross toolchain
        if: matrix.platform == 'linux' && matrix.native == false
        run: |
          UBUNTU_CODENAME="$(lsb_release -cs)"

          # The default sources.list on GitHub's Ubuntu runners has no
          # [arch=...] restriction, so once a foreign architecture is
          # enabled, apt tries to fetch it from archive.ubuntu.com and
          # security.ubuntu.com too - which don't host arm64/armhf/riscv64
          # at all (only ports.ubuntu.com does), causing apt-get update to
          # 404 and fail outright. Pin the default sources to amd64,i386
          # first so they're left alone, then add a dedicated ports.ubuntu.com
          # source scoped to just the architecture this job needs.
          sudo sed -i -E 's/^deb (\[[^]]*\] )?/deb [arch=amd64,i386] /' /etc/apt/sources.list

          # Only touch the foreign architecture this specific job needs.
          # armhf/arm64/riscv64 don't exist in the default archive.ubuntu.com
          # sources on GitHub runners (only amd64/i386 live there) - they're
          # served from ports.ubuntu.com. i386 doesn't need this since it's
          # already part of the default archive.
          case "${{ matrix.arch }}" in
            i686)
              sudo dpkg --add-architecture i386
              sudo apt-get update

              sudo apt-get install -y \
                autoconf automake libtool pkg-config \
                gcc-multilib g++-multilib \
                libcurl4-openssl-dev:i386 \
                libjansson-dev:i386 \
                libssl-dev:i386 \
                libgmp-dev:i386
              ;;
            armv7l)
              sudo dpkg --add-architecture armhf
              echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports ${UBUNTU_CODENAME} main universe" \
                | sudo tee /etc/apt/sources.list.d/armhf.list
              sudo apt-get update

              sudo apt-get install -y \
                autoconf automake libtool pkg-config \
                gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
                libc6-dev-armhf-cross \
                libcurl4-openssl-dev:armhf \
                libjansson-dev:armhf \
                libssl-dev:armhf \
                libgmp-dev:armhf
              ;;
            aarch64)
              sudo dpkg --add-architecture arm64
              echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${UBUNTU_CODENAME} main universe" \
                | sudo tee /etc/apt/sources.list.d/arm64.list
              sudo apt-get update

              sudo apt-get install -y \
                autoconf automake libtool pkg-config \
                gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                libc6-dev-arm64-cross \
                libcurl4-openssl-dev:arm64 \
                libjansson-dev:arm64 \
                libssl-dev:arm64 \
                libgmp-dev:arm64
              ;;
            riscv64)
              sudo dpkg --add-architecture riscv64
              echo "deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports ${UBUNTU_CODENAME} main universe" \
                | sudo tee /etc/apt/sources.list.d/riscv64.list
              sudo apt-get update

              sudo apt-get install -y \
                autoconf automake libtool pkg-config \
                gcc-riscv64-linux-gnu g++-riscv64-linux-gnu \
                libc6-dev-riscv64-cross \
                libcurl4-openssl-dev:riscv64 \
                libjansson-dev:riscv64 \
                libssl-dev:riscv64 \
                libgmp-dev:riscv64
              ;;
          esac

      # ============================================================
      # LINUX - BUILD
      # ============================================================
      - name: Build (Linux, native)
        if: matrix.platform == 'linux' && matrix.native == true
        run: |
          ./autogen.sh || true
          ./configure --with-curl
          make ${MAKEJOBS}

      - name: Build (Linux, cross)
        if: matrix.platform == 'linux' && matrix.native == false
        run: |
          ./autogen.sh || true

          HOST="${{ matrix.cross_host }}"
          echo "Cross compiling for: ${HOST}"

          export CC="${HOST}-gcc"
          export CXX="${HOST}-g++"
          export AR="${HOST}-ar"
          export RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip"

          case "${{ matrix.arch }}" in
            i686)
              export CC="gcc"
              export CXX="g++"
              unset AR RANLIB STRIP
              export CFLAGS="-m32"
              export CXXFLAGS="-m32"
              export LDFLAGS="-m32"
              MULTIARCH="i386-linux-gnu"
              ;;
            armv7l)
              export CFLAGS="-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"
              export CXXFLAGS="-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"
              MULTIARCH="arm-linux-gnueabihf"
              ;;
            aarch64)
              export CFLAGS="-march=armv8-a"
              export CXXFLAGS="-march=armv8-a"
              MULTIARCH="aarch64-linux-gnu"
              ;;
            riscv64)
              export CFLAGS="-march=rv64gc -mabi=lp64d"
              export CXXFLAGS="-march=rv64gc -mabi=lp64d"
              MULTIARCH="riscv64-linux-gnu"
              ;;
          esac

          # Point pkg-config at the target arch's .pc files instead of the
          # host's, and allow it to run at all under a cross --host build.
          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_LIBDIR="/usr/lib/${MULTIARCH}/pkgconfig:/usr/share/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1

          ./configure --host="${HOST}" --with-curl
          make ${MAKEJOBS}

      # ============================================================
      # MACOS
      # ============================================================
      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install automake autoconf libtool pkg-config \
                       curl jansson openssl gmp

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          ./autogen.sh || true

          BREW_PREFIX="$(brew --prefix)"
          export CPPFLAGS="-I${BREW_PREFIX}/include"
          export LDFLAGS="-L${BREW_PREFIX}/lib"

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            export CFLAGS="-arch x86_64"
            export CXXFLAGS="-arch x86_64"
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            export CFLAGS="-arch arm64"
            export CXXFLAGS="-arch arm64"
          fi

          ./configure --with-curl --host="${{ matrix.host }}"
          make ${MAKEJOBS}

      # ============================================================
      # WINDOWS i686 - CROSS-COMPILE FROM LINUX
      # (mirrors build_scripts/build-w32.sh, statically linked so no
      # DLL bundling is needed afterward)
      # ============================================================
      - name: Install mingw-w64 i686 cross toolchain
        if: matrix.platform == 'win32-cross'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686 \
            autoconf automake libtool pkg-config \
            build-essential git wget

      - name: Build depends/deps-win32 (curl + pthread-win32, static)
        if: matrix.platform == 'win32-cross'
        run: |
          cd depends/deps-win32
          chmod +x build_win_x86_deps.sh
          ./build_win_x86_deps.sh
          cd ../..

      - name: Build (Windows i686, cross)
        if: matrix.platform == 'win32-cross'
        run: |
          make distclean || true
          rm -f config.status

          autoreconf -fi -I./depends/deps-win32/i686-w64-mingw32/share/aclocal
          ./autogen.sh || true

          ./configure --host=i686-w64-mingw32 \
            LDFLAGS="-L./depends/deps-win32/i686-w64-mingw32/lib -static" \
            CFLAGS="-Wall -O2 -fomit-frame-pointer -I./depends/deps-win32/i686-w64-mingw32/include -std=c99 -DWIN32 -DCURL_STATICLIB -DPTW32_STATIC_LIB" \
            --with-libcurl=depends/deps-win32/i686-w64-mingw32

          make ${MAKEJOBS}
          i686-w64-mingw32-strip -p --strip-debug --strip-unneeded sugarmaker.exe

      - name: Prepare i686-win artifact
        if: matrix.platform == 'win32-cross'
        run: |
          mkdir -p dist
          cp sugarmaker.exe dist/

      # ============================================================
      # WINDOWS - MSYS2 (msystem picked per-arch via matrix, set at
      # environment setup time so the shell actually launches in it)
      # ============================================================
      - name: Setup MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{ matrix.msystem }}
          install: >
            base-devel
            autoconf
            automake
            libtool
            pkg-config

      - name: Install Windows x86_64 dependencies
        if: matrix.platform == 'windows' && matrix.arch == 'x86_64'
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-curl \
            mingw-w64-x86_64-jansson \
            mingw-w64-x86_64-openssl \
            mingw-w64-x86_64-gmp

      - name: Install Windows ARM64 dependencies
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm \
            mingw-w64-clang-aarch64-toolchain \
            mingw-w64-clang-aarch64-curl \
            mingw-w64-clang-aarch64-jansson \
            mingw-w64-clang-aarch64-openssl \
            mingw-w64-clang-aarch64-gmp

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          ./autogen.sh || true
          ./configure --with-curl
          make ${MAKEJOBS}

      # ============================================================
      # WINDOWS - DLL BUNDLE
      # ============================================================
      - name: Bundle Windows DLLs
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp sugarmaker.exe dist/

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            DLL_DIR="/mingw64/bin"
            ldd sugarmaker.exe \
              | grep "$DLL_DIR" \
              | awk '{print $3}' \
              | sort -u \
              | while read dll; do
                  [ -f "$dll" ] && cp "$dll" dist/
                done

          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            DLL_DIR="/clangarm64/bin"
            ldd sugarmaker.exe \
              | grep "$DLL_DIR" \
              | awk '{print $3}' \
              | sort -u \
              | while read dll; do
                  [ -f "$dll" ] && cp "$dll" dist/
                done
          fi

      # ============================================================
      # ARTIFACTS
      # ============================================================
      - name: Prepare Linux/macOS artifact
        if: matrix.platform != 'windows' && matrix.platform != 'win32-cross'
        run: |
          mkdir -p dist
          cp sugarmaker dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sugarmaker-${{ matrix.name }}
          path: dist/*