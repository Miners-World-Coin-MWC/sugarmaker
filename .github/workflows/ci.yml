name: Sugarmaker CI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'contrib/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    env:
      MAKEJOBS: "-j3"

    strategy:
      fail-fast: false
      matrix:
        include:
          # ============================================================
          # LINUX
          # ============================================================

          # Native x86_64
          - name: x86_64-linux
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            native: true

          # 32-bit x86 (cross via multilib)
          - name: i686-linux
            os: ubuntu-22.04
            platform: linux
            arch: i686
            native: false
            cross_host: i686-linux-gnu

          # ARMv7 / 32-bit ARM (cross)
          - name: armv7l-linux
            os: ubuntu-22.04
            platform: linux
            arch: armv7l
            native: false
            cross_host: arm-linux-gnueabihf

          # ARM64 (cross, on an x86_64 runner)
          - name: aarch64-linux
            os: ubuntu-22.04
            platform: linux
            arch: aarch64
            native: false
            cross_host: aarch64-linux-gnu

          # ARM64 (native runner, no cross toolchain needed)
          - name: aarch64-linux-native
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            native: true

          # RISC-V 64 (cross)
          - name: riscv64-linux
            os: ubuntu-22.04
            platform: linux
            arch: riscv64
            native: false
            cross_host: riscv64-linux-gnu

          # ============================================================
          # MACOS
          # ============================================================

          - name: x86_64-macos
            os: macos-15-intel
            platform: macos
            arch: x86_64
            host: x86_64-apple-darwin

          - name: arm64-macos
            os: macos-latest
            platform: macos
            arch: arm64
            host: arm64-apple-darwin

          # ============================================================
          # WINDOWS
          # ============================================================

          - name: x86_64-win
            os: windows-latest
            platform: windows
            arch: x86_64
            msystem: MINGW64

          # 32-bit Windows: MSYS2 dropped mingw-w64-i686-* packages, so this
          # is cross-compiled from a Linux runner using apt's mingw-w64
          # toolchain + the project's own depends/deps-win32 static libs,
          # matching what build_scripts/build-w32.sh already expects.
          - name: i686-win
            os: ubuntu-22.04
            platform: win32-cross
            arch: i686

          - name: arm64-win
            os: windows-11-arm
            platform: windows
            arch: arm64
            msystem: CLANGARM64

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # LINUX - NATIVE DEPS
      # ============================================================
      - name: Install Linux native dependencies
        if: matrix.platform == 'linux' && matrix.native == true
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libcurl4-openssl-dev libjansson-dev libssl-dev libgmp-dev

      # ============================================================
      # LINUX - CROSS TOOLCHAINS
      # ============================================================
      # NOTE: this deliberately does NOT use `dpkg --add-architecture` +
      # foreign-arch dev packages (libcurl4-openssl-dev:arm64 etc). That
      # approach requires pulling in a full foreign runtime stack
      # (libc6:arm64, libssl3:arm64, ...) whose exact pinned versions
      # don't line up between ports.ubuntu.com's `main` suite and what's
      # actually needed, plus third-party repos already on the runner
      # (Microsoft/Docker/Chrome) muddy the multiarch dependency solve -
      # this reliably produces "held broken packages" errors. Since the
      # project only actually links against libcurl (confirmed from
      # build_win_x86_deps.sh - no jansson/openssl/gmp usage anywhere),
      # we sidestep all of that by cross-compiling a static libcurl from
      # source with the plain cross-gcc toolchain instead - the same
      # approach the project's own Windows build scripts already use.
      # The cross-gcc packages below are normal amd64-native packages;
      # no foreign architecture registration is needed at all.
      - name: Install Linux cross toolchain
        if: matrix.platform == 'linux' && matrix.native == false
        run: |
          sudo apt-get update

          case "${{ matrix.arch }}" in
            i686)
              # i386 lives in the default archive already (unlike
              # arm64/armhf/riscv64), so the foreign-arch approach that
              # broke the others actually works fine here - no need to
              # change this one.
              sudo dpkg --add-architecture i386
              sudo apt-get update
              sudo apt-get install -y \
                autoconf automake libtool pkg-config \
                gcc-multilib g++-multilib \
                libcurl4-openssl-dev:i386
              ;;
            armv7l)
              sudo apt-get install -y autoconf automake libtool \
                gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
              ;;
            aarch64)
              sudo apt-get install -y autoconf automake libtool \
                gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
              ;;
            riscv64)
              sudo apt-get install -y autoconf automake libtool \
                gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
              ;;
          esac

      - name: Build static libcurl for cross target
        if: matrix.platform == 'linux' && matrix.native == false && matrix.arch != 'i686'
        run: |
          CURL_VERSION=8.19.0
          CURL_PACKAGE=curl-${CURL_VERSION}
          CURL_PACKAGE_FILE=${CURL_PACKAGE}.tar.gz
          CURL_PREFIX="${PWD}/curl-cross-${{ matrix.arch }}"

          case "${{ matrix.arch }}" in
            armv7l)     HOST="arm-linux-gnueabihf";  export CC="${HOST}-gcc" ;;
            aarch64)    HOST="aarch64-linux-gnu";    export CC="${HOST}-gcc" ;;
            riscv64)    HOST="riscv64-linux-gnu";    export CC="${HOST}-gcc" ;;
          esac

          # Without _GNU_SOURCE, recv()/select() prototypes aren't visible
          # in this cross toolchain's default standard mode, and curl's own
          # configure unconditionally adds -Werror-implicit-function-declaration,
          # turning that into a hard "Unable to link function recv" error.
          export CFLAGS="-D_GNU_SOURCE"

          wget https://curl.se/download/$CURL_PACKAGE_FILE -O $CURL_PACKAGE_FILE
          tar xzf $CURL_PACKAGE_FILE
          cd $CURL_PACKAGE

          ./configure --host="${HOST}" --disable-shared --enable-static \
            --without-ssl --without-libpsl --prefix="${CURL_PREFIX}"
          make -j"$(nproc)" install

          echo "CURL_PREFIX=${CURL_PREFIX}" >> "$GITHUB_ENV"

      # ============================================================
      # LINUX - BUILD
      # ============================================================
      - name: Build (Linux, native)
        if: matrix.platform == 'linux' && matrix.native == true
        run: |
          ./autogen.sh || true
          ./configure --with-curl
          make ${MAKEJOBS}

      - name: Build (Linux, cross)
        if: matrix.platform == 'linux' && matrix.native == false
        run: |
          ./autogen.sh || true

          HOST="${{ matrix.cross_host }}"
          echo "Cross compiling for: ${HOST}"

          export CC="${HOST}-gcc"
          export CXX="${HOST}-g++"
          export AR="${HOST}-ar"
          export RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip"

          if [ "${{ matrix.arch }}" = "i686" ]; then
            # i686 links against the apt-installed i386 libcurl via
            # pkg-config, same as it did before - this path was already
            # working, only armv7l/aarch64/riscv64 needed the from-source
            # rewrite.
            export CC="gcc"
            export CXX="g++"
            unset AR RANLIB STRIP
            export CFLAGS="-m32"
            export CXXFLAGS="-m32"
            export LDFLAGS="-m32"
            export PKG_CONFIG_PATH=""
            export PKG_CONFIG_LIBDIR="/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig"
            export PKG_CONFIG_ALLOW_CROSS=1

            ./configure --host="${HOST}" --with-curl
            make ${MAKEJOBS}
            exit 0
          fi

          case "${{ matrix.arch }}" in
            armv7l)
              export CFLAGS="-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"
              export CXXFLAGS="-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"
              ;;
            aarch64)
              export CFLAGS="-march=armv8-a"
              export CXXFLAGS="-march=armv8-a"
              ;;
            riscv64)
              export CFLAGS="-march=rv64gc -mabi=lp64d"
              export CXXFLAGS="-march=rv64gc -mabi=lp64d"
              ;;
          esac

          # CURL_PREFIX was exported to $GITHUB_ENV by the previous step
          # (the static libcurl we just cross-compiled for this target).
          ./configure --host="${HOST}" --with-libcurl="${CURL_PREFIX}" \
            LDFLAGS="-static"
          make ${MAKEJOBS}

      # ============================================================
      # MACOS
      # ============================================================
      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install automake autoconf libtool pkg-config \
                       curl jansson openssl gmp

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          ./autogen.sh || true

          BREW_PREFIX="$(brew --prefix)"
          export CPPFLAGS="-I${BREW_PREFIX}/include"
          export LDFLAGS="-L${BREW_PREFIX}/lib"

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            export CFLAGS="-arch x86_64"
            export CXXFLAGS="-arch x86_64"
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            export CFLAGS="-arch arm64"
            export CXXFLAGS="-arch arm64"
          fi

          ./configure --with-curl --host="${{ matrix.host }}"
          make ${MAKEJOBS}

      # ============================================================
      # WINDOWS i686 - CROSS-COMPILE FROM LINUX
      # (mirrors build_scripts/build-w32.sh, statically linked so no
      # DLL bundling is needed afterward)
      # ============================================================
      - name: Install mingw-w64 i686 cross toolchain
        if: matrix.platform == 'win32-cross'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686 \
            autoconf automake libtool pkg-config \
            build-essential git wget

      - name: Build depends/deps-win32 (curl + pthread-win32, static)
        if: matrix.platform == 'win32-cross'
        run: |
          cd depends/deps-win32
          chmod +x build_win_x86_deps.sh
          ./build_win_x86_deps.sh
          cd ../..

      - name: Build (Windows i686, cross)
        if: matrix.platform == 'win32-cross'
        run: |
          make distclean || true
          rm -f config.status

          autoreconf -fi -I./depends/deps-win32/i686-w64-mingw32/share/aclocal
          ./autogen.sh || true

          ./configure --host=i686-w64-mingw32 \
            LDFLAGS="-L./depends/deps-win32/i686-w64-mingw32/lib -static" \
            CFLAGS="-Wall -O2 -fomit-frame-pointer -I./depends/deps-win32/i686-w64-mingw32/include -std=c99 -DWIN32 -D_WIN32_WINNT=0x0600 -DCURL_STATICLIB -DPTW32_STATIC_LIB" \
            --with-libcurl=depends/deps-win32/i686-w64-mingw32

          make ${MAKEJOBS}
          i686-w64-mingw32-strip -p --strip-debug --strip-unneeded sugarmaker.exe

      - name: Prepare i686-win artifact
        if: matrix.platform == 'win32-cross'
        run: |
          mkdir -p dist
          cp sugarmaker.exe dist/

      # ============================================================
      # WINDOWS - MSYS2 (msystem picked per-arch via matrix, set at
      # environment setup time so the shell actually launches in it)
      # ============================================================
      - name: Setup MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{ matrix.msystem }}
          install: >
            base-devel
            autoconf
            automake
            libtool
            pkg-config

      - name: Install Windows x86_64 dependencies
        if: matrix.platform == 'windows' && matrix.arch == 'x86_64'
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-curl \
            mingw-w64-x86_64-jansson \
            mingw-w64-x86_64-openssl \
            mingw-w64-x86_64-gmp

      - name: Install Windows ARM64 dependencies
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm \
            mingw-w64-clang-aarch64-toolchain \
            mingw-w64-clang-aarch64-curl \
            mingw-w64-clang-aarch64-jansson \
            mingw-w64-clang-aarch64-openssl \
            mingw-w64-clang-aarch64-gmp

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          ./autogen.sh || true
          ./configure --with-curl
          make ${MAKEJOBS}

      # ============================================================
      # WINDOWS - DLL BUNDLE
      # ============================================================
      - name: Bundle Windows DLLs
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp sugarmaker.exe dist/

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            DLL_DIR="/mingw64/bin"
            ldd sugarmaker.exe \
              | grep "$DLL_DIR" \
              | awk '{print $3}' \
              | sort -u \
              | while read dll; do
                  [ -f "$dll" ] && cp "$dll" dist/
                done

          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            DLL_DIR="/clangarm64/bin"
            ldd sugarmaker.exe \
              | grep "$DLL_DIR" \
              | awk '{print $3}' \
              | sort -u \
              | while read dll; do
                  [ -f "$dll" ] && cp "$dll" dist/
                done
          fi

      # ============================================================
      # ARTIFACTS
      # ============================================================
      - name: Prepare Linux/macOS artifact
        if: matrix.platform != 'windows' && matrix.platform != 'win32-cross'
        run: |
          mkdir -p dist
          cp sugarmaker dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sugarmaker-${{ matrix.name }}
          path: dist/*