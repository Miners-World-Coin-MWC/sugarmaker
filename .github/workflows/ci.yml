name: Sugarmaker CI

on:
  push:
    paths-ignore:
      - '**/*.md'

  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'contrib/**'
      - '**/*.md'

  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    env:
      MAKEJOBS: "-j3"

    strategy:
      fail-fast: false

      matrix:
        include:

          # ============================================================
          # LINUX
          # ============================================================

          # Native x86_64
          - name: x86_64-linux
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            native: true

          # 32-bit x86
          - name: i686-linux
            os: ubuntu-22.04
            platform: linux
            arch: i686
            native: false
            cross_host: i686-linux-gnu

          # ARMv7
          - name: armv7l-linux
            os: ubuntu-22.04
            platform: linux
            arch: armv7l
            native: false
            cross_host: arm-linux-gnueabihf

          # ARM64
          - name: aarch64-linux
            os: ubuntu-22.04
            platform: linux
            arch: aarch64
            native: false
            cross_host: aarch64-linux-gnu

          # ARM64 native
          - name: aarch64-linux-native
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            native: true

          # RISC-V 64
          - name: riscv64-linux
            os: ubuntu-22.04
            platform: linux
            arch: riscv64
            native: false
            cross_host: riscv64-linux-gnu

          # ============================================================
          # MACOS
          # ============================================================

          - name: x86_64-macos
            os: macos-15-intel
            platform: macos
            arch: x86_64
            host: x86_64-apple-darwin

          - name: arm64-macos
            os: macos-latest
            platform: macos
            arch: arm64
            host: arm64-apple-darwin

          # ============================================================
          # WINDOWS
          # ============================================================

          - name: x86_64-win
            os: windows-latest
            platform: windows
            arch: x86_64
            msystem: MINGW64

          # 32-bit Windows
          - name: i686-win
            os: ubuntu-22.04
            platform: win32-cross
            arch: i686

          # ARM64 Windows
          - name: arm64-win
            os: windows-11-arm
            platform: windows
            arch: arm64
            msystem: CLANGARM64

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ================================================================
      # LINUX - NATIVE DEPENDENCIES
      # ================================================================

      - name: Install Linux native dependencies
        if: matrix.platform == 'linux' && matrix.native == true
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libcurl4-openssl-dev \
            libjansson-dev \
            libssl-dev \
            libgmp-dev

      # ================================================================
      # LINUX - CROSS TOOLCHAINS
      # ================================================================

      - name: Install Linux cross toolchain
        if: matrix.platform == 'linux' && matrix.native == false
        run: |
          sudo apt-get update

          case "${{ matrix.arch }}" in

            i686)
              sudo dpkg --add-architecture i386
              sudo apt-get update

              sudo apt-get install -y \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gcc-multilib \
                g++-multilib \
                libcurl4-openssl-dev:i386
              ;;

            armv7l)
              sudo apt-get install -y \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gcc-arm-linux-gnueabihf \
                g++-arm-linux-gnueabihf
              ;;

            aarch64)
              sudo apt-get install -y \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gcc-aarch64-linux-gnu \
                g++-aarch64-linux-gnu
              ;;

            riscv64)
              sudo apt-get install -y \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gcc-riscv64-linux-gnu \
                g++-riscv64-linux-gnu
              ;;

          esac

      # ================================================================
      # BUILD STATIC CURL FOR ARM/RISCV CROSS BUILDS
      #
      # IMPORTANT:
      #
      # We deliberately disable optional compression/IDN/etc libraries.
      #
      # The previous failure:
      #
      #   cannot find -lz
      #
      # happened because curl's configure detected zlib.h and then
      # attempted to link the TARGET zlib library. The Ubuntu runner has
      # the native x86_64 zlib, but not the ARM/RISC-V target zlib.
      #
      # Sugarmaker only requires libcurl, so there is no reason to drag
      # those optional target libraries into this cross build.
      # ================================================================

      - name: Build static libcurl for ARM/RISC-V cross target
        if: matrix.platform == 'linux' && matrix.native == false && matrix.arch != 'i686'
        shell: bash
        run: |

          set -e

          CURL_VERSION=8.19.0
          CURL_PACKAGE=curl-${CURL_VERSION}
          CURL_PACKAGE_FILE=${CURL_PACKAGE}.tar.gz

          CURL_PREFIX="${PWD}/curl-cross-${{ matrix.arch }}"

          case "${{ matrix.arch }}" in

            armv7l)
              HOST="arm-linux-gnueabihf"
              export CC="${HOST}-gcc"
              export CXX="${HOST}-g++"
              export AR="${HOST}-ar"
              export RANLIB="${HOST}-ranlib"
              export STRIP="${HOST}-strip"

              export CFLAGS="-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"
              export CXXFLAGS="${CFLAGS}"
              ;;

            aarch64)
              HOST="aarch64-linux-gnu"
              export CC="${HOST}-gcc"
              export CXX="${HOST}-g++"
              export AR="${HOST}-ar"
              export RANLIB="${HOST}-ranlib"
              export STRIP="${HOST}-strip"

              export CFLAGS="-march=armv8-a"
              export CXXFLAGS="${CFLAGS}"
              ;;

            riscv64)
              HOST="riscv64-linux-gnu"
              export CC="${HOST}-gcc"
              export CXX="${HOST}-g++"
              export AR="${HOST}-ar"
              export RANLIB="${HOST}-ranlib"
              export STRIP="${HOST}-strip"

              export CFLAGS="-march=rv64gc -mabi=lp64d"
              export CXXFLAGS="${CFLAGS}"
              ;;

          esac

          echo "============================================================"
          echo "Building static curl"
          echo "Target : ${HOST}"
          echo "Prefix : ${CURL_PREFIX}"
          echo "CC     : ${CC}"
          echo "CFLAGS : ${CFLAGS}"
          echo "============================================================"

          wget -q \
            "https://curl.se/download/${CURL_PACKAGE_FILE" \
            -O "${CURL_PACKAGE_FILE}" || \
          wget \
            "https://curl.se/download/${CURL_PACKAGE_FILE}" \
            -O "${CURL_PACKAGE_FILE}"

          tar xzf "${CURL_PACKAGE_FILE}"

          cd "${CURL_PACKAGE}"

          # Do NOT allow host pkg-config files to contaminate the
          # cross compilation.
          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_LIBDIR=""

          # Keep feature set deliberately minimal.
          #
          # In particular:
          #   --without-zlib
          #   --without-brotli
          #   --without-zstd
          #   --without-libidn2
          #
          # prevent curl from trying to link target libraries which
          # aren't installed on the Ubuntu runner.
          ./configure \
            --build=x86_64-pc-linux-gnu \
            --host="${HOST}" \
            --prefix="${CURL_PREFIX}" \
            --disable-shared \
            --enable-static \
            --without-ssl \
            --without-zlib \
            --without-brotli \
            --without-zstd \
            --without-libidn2 \
            --without-libpsl \
            --without-nghttp2 \
            --without-nghttp3 \
            --without-ngtcp2 \
            --without-quiche \
            --without-libssh2 \
            --without-librtmp \
            --without-ldap \
            --without-rtmp \
            --without-rtsp \
            --without-libpsl \
            --disable-ldap \
            --disable-ldaps \
            --disable-rtsp \
            --disable-dict \
            --disable-telnet \
            --disable-tftp \
            --disable-pop3 \
            --disable-imap \
            --disable-smtp \
            --disable-gopher \
            --disable-mqtt \
            --disable-unix-sockets \
            --disable-shared \
            --enable-static

          make ${MAKEJOBS}

          make install

          cd ..

          echo "CURL_PREFIX=${CURL_PREFIX}" >> "$GITHUB_ENV"

          echo "============================================================"
          echo "Static curl installed:"
          echo "${CURL_PREFIX}"
          echo "============================================================"

          find "${CURL_PREFIX}" -maxdepth 3 -type f | sort

      # ================================================================
      # LINUX - NATIVE BUILD
      # ================================================================

      - name: Build (Linux, native)
        if: matrix.platform == 'linux' && matrix.native == true
        shell: bash
        run: |
          set -e

          ./autogen.sh || true

          ./configure \
            --with-curl

          make ${MAKEJOBS}

      # ================================================================
      # LINUX - CROSS BUILD
      # ================================================================

      - name: Build (Linux, cross)
        if: matrix.platform == 'linux' && matrix.native == false
        shell: bash
        run: |

          set -e

          ./autogen.sh || true

          HOST="${{ matrix.cross_host }}"

          echo "============================================================"
          echo "Cross compiling Sugarmaker"
          echo "Target: ${HOST}"
          echo "============================================================"

          export CC="${HOST}-gcc"
          export CXX="${HOST}-g++"
          export AR="${HOST}-ar"
          export RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip"

          # ------------------------------------------------------------
          # i686 Linux
          # ------------------------------------------------------------

          if [ "${{ matrix.arch }}" = "i686" ]; then

            export CC="gcc"
            export CXX="g++"

            unset AR
            unset RANLIB
            unset STRIP

            export CFLAGS="-m32"
            export CXXFLAGS="-m32"
            export LDFLAGS="-m32"

            export PKG_CONFIG_PATH=""
            export PKG_CONFIG_LIBDIR="/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig"
            export PKG_CONFIG_ALLOW_CROSS=1

            ./configure \
              --host="${HOST}" \
              --with-curl

            make ${MAKEJOBS}

            exit 0
          fi

          # ------------------------------------------------------------
          # ARMv7
          # ------------------------------------------------------------

          if [ "${{ matrix.arch }}" = "armv7l" ]; then

            export CFLAGS="-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"
            export CXXFLAGS="${CFLAGS}"

          fi

          # ------------------------------------------------------------
          # ARM64
          # ------------------------------------------------------------

          if [ "${{ matrix.arch }}" = "aarch64" ]; then

            export CFLAGS="-march=armv8-a"
            export CXXFLAGS="${CFLAGS}"

          fi

          # ------------------------------------------------------------
          # RISC-V 64
          # ------------------------------------------------------------

          if [ "${{ matrix.arch }}" = "riscv64" ]; then

            export CFLAGS="-march=rv64gc -mabi=lp64d"
            export CXXFLAGS="${CFLAGS}"

          fi

          echo "CC=${CC}"
          echo "CXX=${CXX}"
          echo "CFLAGS=${CFLAGS}"
          echo "CXXFLAGS=${CXXFLAGS}"
          echo "CURL_PREFIX=${CURL_PREFIX}"

          # ------------------------------------------------------------
          # Cross configure
          # ------------------------------------------------------------

          ./configure \
            --host="${HOST}" \
            --with-curl="${CURL_PREFIX}" \
            LDFLAGS="-static" \
          || {
            echo ""
            echo "============================================================"
            echo "Sugarmaker configure failed"
            echo "============================================================"

            if [ -f config.log ]; then
              tail -250 config.log
            fi

            exit 1
          }

          make ${MAKEJOBS}

      # ================================================================
      # MACOS DEPENDENCIES
      # ================================================================

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew update

          brew install \
            automake \
            autoconf \
            libtool \
            pkg-config \
            curl \
            jansson \
            openssl \
            gmp

      # ================================================================
      # MACOS BUILD
      # ================================================================

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |

          set -e

          ./autogen.sh || true

          BREW_PREFIX="$(brew --prefix)"

          export CPPFLAGS="-I${BREW_PREFIX}/include"
          export LDFLAGS="-L${BREW_PREFIX}/lib"

          if [ "${{ matrix.arch }}" = "x86_64" ]; then

            export CFLAGS="-arch x86_64"
            export CXXFLAGS="-arch x86_64"

          elif [ "${{ matrix.arch }}" = "arm64" ]; then

            export CFLAGS="-arch arm64"
            export CXXFLAGS="-arch arm64"

          fi

          ./configure \
            --with-curl \
            --host="${{ matrix.host }}"

          make ${MAKEJOBS}

      # ================================================================
      # WINDOWS i686
      #
      # CROSS COMPILE FROM UBUNTU
      # ================================================================

      - name: Install MinGW-w64 i686 cross toolchain
        if: matrix.platform == 'win32-cross'
        shell: bash
        run: |

          set -e

          sudo dpkg --add-architecture i386 || true

          sudo apt-get update

          sudo apt-get install -y \
            gcc-mingw-w64-i686-posix \
            g++-mingw-w64-i686-posix \
            binutils-mingw-w64-i686 \
            mingw-w64-i686-dev \
            mingw-w64-common \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            git \
            wget

          echo "============================================================"
          echo "MinGW i686 compiler:"
          echo "============================================================"

          which i686-w64-mingw32-gcc-posix || true
          which i686-w64-mingw32-g++-posix || true
          which i686-w64-mingw32-ar || true
          which i686-w64-mingw32-ranlib || true
          which i686-w64-mingw32-strip || true

          i686-w64-mingw32-gcc-posix --version
          i686-w64-mingw32-g++-posix --version

          # Explicitly test that the MinGW compiler can actually create
          # a Windows executable BEFORE Autoconf gets involved.
          cat > /tmp/test.c <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          i686-w64-mingw32-gcc-posix \
            /tmp/test.c \
            -o /tmp/test.exe

          file /tmp/test.exe

          echo "MinGW i686 compiler test passed."

      # ================================================================
      # WINDOWS i686 DEPENDENCIES
      # ================================================================

      - name: Build deps-win32 for i686 Windows
        if: matrix.platform == 'win32-cross'
        shell: bash
        run: |

          set -e

          cd depends/deps-win32

          chmod +x build_win_x86_deps.sh

          ./build_win_x86_deps.sh

          cd ../..

          echo "============================================================"
          echo "Windows i686 dependency tree:"
          echo "============================================================"

          find depends/deps-win32/i686-w64-mingw32 \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

      # ================================================================
      # WINDOWS i686 BUILD
      # ================================================================

      - name: Build (Windows i686, cross)
        if: matrix.platform == 'win32-cross'
        shell: bash
        run: |

          set -e

          echo "============================================================"
          echo "Preparing Windows i686 build"
          echo "============================================================"

          # distclean does not necessarily exist on a fresh checkout.
          # Do not treat that as a build failure.
          make distclean || true

          rm -f config.status
          rm -f config.cache

          # ------------------------------------------------------------
          # Force the POSIX MinGW compiler explicitly.
          #
          # This avoids Ubuntu's alternatives system selecting a broken
          # or differently configured i686-w64-mingw32-gcc.
          # ------------------------------------------------------------

          export CC="i686-w64-mingw32-gcc-posix"
          export CXX="i686-w64-mingw32-g++-posix"
          export AR="i686-w64-mingw32-ar"
          export RANLIB="i686-w64-mingw32-ranlib"
          export STRIP="i686-w64-mingw32-strip"
          export WINDRES="i686-w64-mingw32-windres"

          export HOST="i686-w64-mingw32"

          export CFLAGS="-Wall -O2 -fomit-frame-pointer -std=c99 -DWIN32 -D_WIN32_WINNT=0x0600 -DCURL_STATICLIB -DPTW32_STATIC_LIB"
          export CXXFLAGS="-Wall -O2 -fomit-frame-pointer -DWIN32 -D_WIN32_WINNT=0x0600 -DCURL_STATICLIB -DPTW32_STATIC_LIB"

          export LDFLAGS="-static"

          # Static curl + Windows system libraries.
          export LIBS="-lcurl -lws2_32 -lcrypt32 -lsecur32 -lwldap32 -lbcrypt -liphlpapi"

          CURL_PREFIX="${PWD}/depends/deps-win32/i686-w64-mingw32"

          echo "============================================================"
          echo "Compiler configuration"
          echo "============================================================"

          echo "CC=${CC}"
          echo "CXX=${CXX}"
          echo "AR=${AR}"
          echo "RANLIB=${RANLIB}"
          echo "STRIP=${STRIP}"
          echo "CURL_PREFIX=${CURL_PREFIX}"

          "${CC}" --version
          "${CXX}" --version

          # ------------------------------------------------------------
          # Verify the dependency prefix actually exists.
          # ------------------------------------------------------------

          test -d "${CURL_PREFIX}"

          test -f "${CURL_PREFIX}/lib/libcurl.a"

          echo "Found:"
          echo "  ${CURL_PREFIX}/lib/libcurl.a"

          # ------------------------------------------------------------
          # Regenerate Autotools files.
          # ------------------------------------------------------------

          autoreconf -fi \
            -I"${CURL_PREFIX}/share/aclocal"

          # autogen.sh can regenerate additional project files, but its
          # failure should not hide the actual configure error.
          ./autogen.sh || true

          # ------------------------------------------------------------
          # Configure
          # ------------------------------------------------------------

          ./configure \
            --build=x86_64-pc-linux-gnu \
            --host="${HOST}" \
            --with-curl="${CURL_PREFIX}" \
            CFLAGS="${CFLAGS}" \
            CXXFLAGS="${CXXFLAGS}" \
            LDFLAGS="${LDFLAGS}" \
            LIBS="${LIBS}" \
          || {

            echo ""
            echo "============================================================"
            echo "WINDOWS i686 CONFIGURE FAILED"
            echo "============================================================"

            echo ""
            echo "===== Compiler test ====="

            cat > /tmp/test-config.c <<'EOF'
            int main(void)
            {
                return 0;
            }
            EOF

            "${CC}" \
              ${CFLAGS} \
              /tmp/test-config.c \
              -o /tmp/test-config.exe \
              ${LDFLAGS} \
              || true

            echo ""
            echo "===== config.log tail ====="

            if [ -f config.log ]; then
              tail -300 config.log
            fi

            exit 1
          }

          # ------------------------------------------------------------
          # Build
          # ------------------------------------------------------------

          make ${MAKEJOBS}

          # ------------------------------------------------------------
          # Strip
          # ------------------------------------------------------------

          i686-w64-mingw32-strip \
            -p \
            --strip-debug \
            --strip-unneeded \
            sugarmaker.exe

          file sugarmaker.exe

      # ================================================================
      # PREPARE i686 WINDOWS ARTIFACT
      # ================================================================

      - name: Prepare i686-win artifact
        if: matrix.platform == 'win32-cross'
        shell: bash
        run: |

          set -e

          mkdir -p dist

          cp sugarmaker.exe dist/

          file dist/sugarmaker.exe

      # ================================================================
      # WINDOWS - MSYS2 SETUP
      # ================================================================

      - name: Setup MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2

        with:
          update: true
          msystem: ${{ matrix.msystem }}

          install: >
            base-devel
            autoconf
            automake
            libtool
            pkg-config

      # ================================================================
      # WINDOWS x86_64 DEPENDENCIES
      # ================================================================

      - name: Install Windows x86_64 dependencies
        if: matrix.platform == 'windows' && matrix.arch == 'x86_64'
        shell: msys2 {0}
        run: |

          pacman -S --noconfirm \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-curl \
            mingw-w64-x86_64-jansson \
            mingw-w64-x86_64-openssl \
            mingw-w64-x86_64-gmp

      # ================================================================
      # WINDOWS ARM64 DEPENDENCIES
      # ================================================================

      - name: Install Windows ARM64 dependencies
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: msys2 {0}
        run: |

          pacman -S --noconfirm \
            mingw-w64-clang-aarch64-toolchain \
            mingw-w64-clang-aarch64-curl \
            mingw-w64-clang-aarch64-jansson \
            mingw-w64-clang-aarch64-openssl \
            mingw-w64-clang-aarch64-gmp

      # ================================================================
      # WINDOWS BUILD
      # ================================================================

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |

          set -e

          ./autogen.sh || true

          ./configure \
            --with-curl

          make ${MAKEJOBS}

      # ================================================================
      # WINDOWS DLL BUNDLE
      # ================================================================

      - name: Bundle Windows DLLs
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |

          set -e

          mkdir -p dist

          cp sugarmaker.exe dist/

          if [ "${{ matrix.arch }}" = "x86_64" ]; then

            DLL_DIR="/mingw64/bin"

            ldd sugarmaker.exe \
              | grep "$DLL_DIR" \
              | awk '{print $3}' \
              | sort -u \
              | while read dll; do

                  [ -f "$dll" ] && cp "$dll" dist/

                done

          elif [ "${{ matrix.arch }}" = "arm64" ]; then

            DLL_DIR="/clangarm64/bin"

            ldd sugarmaker.exe \
              | grep "$DLL_DIR" \
              | awk '{print $3}' \
              | sort -u \
              | while read dll; do

                  [ -f "$dll" ] && cp "$dll" dist/

                done

          fi

      # ================================================================
      # LINUX / MACOS ARTIFACT
      # ================================================================

      - name: Prepare Linux/macOS artifact
        if: matrix.platform != 'windows' && matrix.platform != 'win32-cross'
        shell: bash
        run: |

          set -e

          mkdir -p dist

          cp sugarmaker dist/

      # ================================================================
      # UPLOAD ARTIFACTS
      # ================================================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4

        with:
          name: sugarmaker-${{ matrix.name }}
          path: dist/*
