name: Sugarmaker CI + GUI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'contrib/**'
      - '**/*.md'
  workflow_dispatch:

env:
  MAKEJOBS: "-j3"

jobs:

  # ========================================================================
  # BUILD MINER + GUI FOR EVERY TARGET
  # ========================================================================

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # ==================================================================
          # LINUX
          # ==================================================================

          - name: x86_64-linux
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            native: true
            rust_target: x86_64-unknown-linux-gnu

          - name: i686-linux
            os: ubuntu-22.04
            platform: linux
            arch: i686
            native: false
            cross_host: i686-linux-gnu
            rust_target: i686-unknown-linux-gnu

          - name: armv7l-linux
            os: ubuntu-22.04
            platform: linux
            arch: armv7l
            native: false
            cross_host: arm-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf

          - name: aarch64-linux
            os: ubuntu-22.04
            platform: linux
            arch: aarch64
            native: false
            cross_host: aarch64-linux-gnu
            rust_target: aarch64-unknown-linux-gnu

          - name: aarch64-linux-native
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            native: true
            rust_target: aarch64-unknown-linux-gnu

          - name: riscv64-linux
            os: ubuntu-22.04
            platform: linux
            arch: riscv64
            native: false
            cross_host: riscv64-linux-gnu
            rust_target: riscv64gc-unknown-linux-gnu

          # ==================================================================
          # MACOS
          # ==================================================================

          - name: x86_64-macos
            os: macos-15-intel
            platform: macos
            arch: x86_64
            host: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin

          - name: arm64-macos
            os: macos-latest
            platform: macos
            arch: arm64
            host: arm64-apple-darwin
            rust_target: aarch64-apple-darwin

          # ==================================================================
          # WINDOWS
          # ==================================================================

          - name: x86_64-win
            os: windows-latest
            platform: windows
            arch: x86_64
            native: true
            msystem: MINGW64
            rust_target: x86_64-pc-windows-gnu

          - name: i686-win
            os: ubuntu-22.04
            platform: win32-cross
            arch: i686
            native: false
            rust_target: i686-pc-windows-gnu

          - name: arm64-win
            os: windows-11-arm
            platform: windows
            arch: arm64
            native: true
            msystem: CLANGARM64
            rust_target: aarch64-pc-windows-gnullvm


    steps:

      # ======================================================================
      # CHECKOUT
      # ======================================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================================
      # NODE
      # ======================================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ======================================================================
      # RUST
      # ======================================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}


      # ======================================================================
      # LINUX NATIVE DEPENDENCIES
      # ======================================================================

      - name: Install Linux native dependencies
        if: matrix.platform == 'linux' && matrix.native == true
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libcurl4-openssl-dev \
            libjansson-dev \
            libssl-dev \
            libgmp-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf


      # ======================================================================
      # LINUX CROSS TOOLCHAINS
      # ======================================================================

      - name: Install Linux cross toolchain
        if: matrix.platform == 'linux' && matrix.native == false
        shell: bash
        run: |
          set -e

          sudo apt-get update

          case "${{ matrix.arch }}" in

            i686)
              sudo dpkg --add-architecture i386
              sudo apt-get update

              sudo apt-get install -y \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gcc-multilib \
                g++-multilib \
                libcurl4-openssl-dev:i386 \
                libwebkit2gtk-4.1-dev \
                libappindicator3-dev \
                librsvg2-dev \
                patchelf
              ;;

            armv7l)
              sudo apt-get install -y \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gcc-arm-linux-gnueabihf \
                g++-arm-linux-gnueabihf \
                libwebkit2gtk-4.1-dev \
                libappindicator3-dev \
                librsvg2-dev \
                patchelf
              ;;

            aarch64)
              sudo apt-get install -y \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gcc-aarch64-linux-gnu \
                g++-aarch64-linux-gnu \
                libwebkit2gtk-4.1-dev \
                libappindicator3-dev \
                librsvg2-dev \
                patchelf
              ;;

            riscv64)
              sudo apt-get install -y \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gcc-riscv64-linux-gnu \
                g++-riscv64-linux-gnu \
                libwebkit2gtk-4.1-dev \
                libappindicator3-dev \
                librsvg2-dev \
                patchelf
              ;;

            *)
              echo "Unsupported architecture: ${{ matrix.arch }}"
              exit 1
              ;;
          esac


      # ======================================================================
      # LINUX CROSS CURL
      # ======================================================================

      - name: Build static libcurl for Linux cross target
        if: matrix.platform == 'linux' && matrix.native == false && matrix.arch != 'i686'
        shell: bash
        run: |
          set -e

          CURL_VERSION=8.19.0
          CURL_PACKAGE="curl-${CURL_VERSION}"
          CURL_PACKAGE_FILE="${CURL_PACKAGE}.tar.gz"
          CURL_PREFIX="${PWD}/curl-cross-${{ matrix.arch }}"

          case "${{ matrix.arch }}" in

            armv7l)
              HOST="arm-linux-gnueabihf"

              export CC="${HOST}-gcc"
              export CXX="${HOST}-g++"
              export AR="${HOST}-ar"
              export RANLIB="${HOST}-ranlib"
              export STRIP="${HOST}-strip"

              export CFLAGS="-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"
              export CXXFLAGS="${CFLAGS}"
              ;;

            aarch64)
              HOST="aarch64-linux-gnu"

              export CC="${HOST}-gcc"
              export CXX="${HOST}-g++"
              export AR="${HOST}-ar"
              export RANLIB="${HOST}-ranlib"
              export STRIP="${HOST}-strip"

              export CFLAGS="-march=armv8-a"
              export CXXFLAGS="${CFLAGS}"
              ;;

            riscv64)
              HOST="riscv64-linux-gnu"

              export CC="${HOST}-gcc"
              export CXX="${HOST}-g++"
              export AR="${HOST}-ar"
              export RANLIB="${HOST}-ranlib"
              export STRIP="${HOST}-strip"

              export CFLAGS="-march=rv64gc -mabi=lp64d"
              export CXXFLAGS="${CFLAGS}"
              ;;

          esac

          wget -q \
            "https://curl.se/download/${CURL_PACKAGE_FILE}" \
            -O "${CURL_PACKAGE_FILE}"

          tar xzf "${CURL_PACKAGE_FILE}"

          cd "${CURL_PACKAGE}"

          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_LIBDIR=""
          export PKG_CONFIG_ALLOW_CROSS=1

          ./configure \
            --build=x86_64-pc-linux-gnu \
            --host="${HOST}" \
            --prefix="${CURL_PREFIX}" \
            --disable-shared \
            --enable-static \
            --without-ssl \
            --without-zlib \
            --without-brotli \
            --without-zstd \
            --without-libidn2 \
            --without-libpsl \
            --without-nghttp2 \
            --without-nghttp3 \
            --without-ngtcp2 \
            --without-quiche \
            --without-libssh2 \
            --without-librtmp \
            --disable-ldap \
            --disable-ldaps \
            --disable-rtsp \
            --disable-dict \
            --disable-telnet \
            --disable-tftp \
            --disable-pop3 \
            --disable-imap \
            --disable-smtp \
            --disable-gopher \
            --disable-mqtt \
            --disable-unix-sockets

          make ${MAKEJOBS}
          make install

          cd ..

          echo "CURL_PREFIX=${CURL_PREFIX}" >> "$GITHUB_ENV"

          test -f "${CURL_PREFIX}/lib/libcurl.a"
          test -f "${CURL_PREFIX}/include/curl/curl.h"


      # ======================================================================
      # BUILD MINER - LINUX NATIVE
      # ======================================================================

      - name: Build Sugarmaker - Linux native
        if: matrix.platform == 'linux' && matrix.native == true
        shell: bash
        run: |
          set -e

          ./autogen.sh || true

          ./configure \
            --with-curl

          make ${MAKEJOBS}


      # ======================================================================
      # BUILD MINER - LINUX CROSS
      # ======================================================================

      - name: Build Sugarmaker - Linux cross
        if: matrix.platform == 'linux' && matrix.native == false
        shell: bash
        run: |
          set -e

          ./autogen.sh || true

          HOST="${{ matrix.cross_host }}"

          export CC="${HOST}-gcc"
          export CXX="${HOST}-g++"
          export AR="${HOST}-ar"
          export RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip"

          if [ "${{ matrix.arch }}" = "i686" ]; then

            export CC="gcc"
            export CXX="g++"

            unset AR
            unset RANLIB
            unset STRIP

            export CFLAGS="-m32"
            export CXXFLAGS="-m32"
            export LDFLAGS="-m32"

            export PKG_CONFIG_PATH=""
            export PKG_CONFIG_LIBDIR="/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig"
            export PKG_CONFIG_ALLOW_CROSS=1

            ./configure \
              --host="${HOST}" \
              --with-curl

            make ${MAKEJOBS}

            exit 0
          fi

          case "${{ matrix.arch }}" in

            armv7l)
              export CFLAGS="-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"
              export CXXFLAGS="${CFLAGS}"
              ;;

            aarch64)
              export CFLAGS="-march=armv8-a"
              export CXXFLAGS="${CFLAGS}"
              ;;

            riscv64)
              export CFLAGS="-march=rv64gc -mabi=lp64d"
              export CXXFLAGS="${CFLAGS}"
              ;;

          esac

          ./configure \
            --host="${HOST}" \
            --with-curl="${CURL_PREFIX}" \
            CFLAGS="${CFLAGS}" \
            CXXFLAGS="${CXXFLAGS}" \
            LDFLAGS="-static"

          make ${MAKEJOBS}


      # ======================================================================
      # MACOS DEPENDENCIES
      # ======================================================================

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -e

          brew install \
            automake \
            autoconf \
            libtool \
            pkg-config \
            curl \
            jansson \
            openssl \
            gmp || true


      # ======================================================================
      # BUILD MINER - MACOS
      # ======================================================================

      - name: Build Sugarmaker - macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -e

          ./autogen.sh || true

          BREW_PREFIX="$(brew --prefix)"

          export CPPFLAGS="-I${BREW_PREFIX}/include"
          export LDFLAGS="-L${BREW_PREFIX}/lib"

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            export CFLAGS="-arch x86_64"
            export CXXFLAGS="-arch x86_64"
          else
            export CFLAGS="-arch arm64"
            export CXXFLAGS="-arch arm64"
          fi

          ./configure \
            --with-curl \
            --host="${{ matrix.host }}"

          make ${MAKEJOBS}


      # ======================================================================
      # WINDOWS i686 CROSS TOOLCHAIN
      # ======================================================================

      - name: Install Windows i686 toolchain
        if: matrix.platform == 'win32-cross'
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            gcc-mingw-w64-i686-posix \
            g++-mingw-w64-i686-posix \
            binutils-mingw-w64-i686 \
            mingw-w64-i686-dev \
            mingw-w64-common \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            git \
            wget \
            file


      # ======================================================================
      # WINDOWS i686 DEPENDENCIES
      # ======================================================================

      - name: Build Windows i686 dependencies
        if: matrix.platform == 'win32-cross'
        shell: bash
        run: |
          set -e

          cd depends/deps-win32

          chmod +x build_win_x86_deps.sh
          ./build_win_x86_deps.sh

          cd ../..

          echo "CURL_PREFIX=${PWD}/depends/deps-win32/i686-w64-mingw32" >> "$GITHUB_ENV"


      # ======================================================================
      # BUILD WINDOWS i686
      # ======================================================================

      - name: Build Sugarmaker - Windows i686
        if: matrix.platform == 'win32-cross'
        shell: bash
        run: |
          set -e

          export HOST="i686-w64-mingw32"

          export CC="i686-w64-mingw32-gcc-posix"
          export CXX="i686-w64-mingw32-g++-posix"
          export AR="i686-w64-mingw32-ar"
          export RANLIB="i686-w64-mingw32-ranlib"
          export STRIP="i686-w64-mingw32-strip"

          CURL_PREFIX="${PWD}/depends/deps-win32/i686-w64-mingw32"

          export CFLAGS="-Wall -O2 -fomit-frame-pointer -std=c99 -DWIN32 -D_WIN32_WINNT=0x0600 -DCURL_STATICLIB -DPTW32_STATIC_LIB"
          export CXXFLAGS="-Wall -O2 -fomit-frame-pointer -DWIN32 -D_WIN32_WINNT=0x0600 -DCURL_STATICLIB -DPTW32_STATIC_LIB"
          export CPPFLAGS="-I${CURL_PREFIX}/include"
          export LDFLAGS="-static -L${CURL_PREFIX}/lib"

          ./autogen.sh || true

          autoreconf -fi \
            -I"${CURL_PREFIX}/share/aclocal"

          export LIBS="-lcurl -lws2_32 -lcrypt32 -lsecur32 -lwldap32 -lbcrypt -liphlpapi -lwinpthread"

          ./configure \
            --build=x86_64-pc-linux-gnu \
            --host="${HOST}" \
            --with-curl="${CURL_PREFIX}" \
            CPPFLAGS="${CPPFLAGS}" \
            CFLAGS="${CFLAGS}" \
            CXXFLAGS="${CXXFLAGS}" \
            LDFLAGS="${LDFLAGS}" \
            LIBS="${LIBS}"

          make ${MAKEJOBS}

          "${STRIP}" \
            -p \
            --strip-debug \
            --strip-unneeded \
            sugarmaker.exe


      # ======================================================================
      # WINDOWS MSYS2
      # ======================================================================

      - name: Setup MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{ matrix.msystem }}
          install: >
            base-devel
            autoconf
            automake
            libtool
            pkg-config


      # ======================================================================
      # WINDOWS x86_64 DEPENDENCIES
      # ======================================================================

      - name: Install Windows x86_64 dependencies
        if: matrix.platform == 'windows' && matrix.arch == 'x86_64'
        shell: msys2 {0}
        run: |
          set -e

          pacman -S --noconfirm \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-curl \
            mingw-w64-x86_64-jansson \
            mingw-w64-x86_64-openssl \
            mingw-w64-x86_64-gmp


      # ======================================================================
      # WINDOWS ARM64 DEPENDENCIES
      # ======================================================================

      - name: Install Windows ARM64 dependencies
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: msys2 {0}
        run: |
          set -e

          pacman -S --noconfirm \
            mingw-w64-clang-aarch64-toolchain \
            mingw-w64-clang-aarch64-curl \
            mingw-w64-clang-aarch64-jansson \
            mingw-w64-clang-aarch64-openssl \
            mingw-w64-clang-aarch64-gmp


      # ======================================================================
      # BUILD WINDOWS
      # ======================================================================

      - name: Build Sugarmaker - Windows
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -e

          ./autogen.sh || true

          ./configure \
            --with-curl

          make ${MAKEJOBS}


      # ======================================================================
      # NORMALIZE MINER BINARY
      # ======================================================================

      - name: Prepare miner binary
        shell: bash
        run: |
          set -e

          mkdir -p build-miner

          if [ "${{ matrix.platform }}" = "windows" ] || [ "${{ matrix.platform }}" = "win32-cross" ]; then
            cp sugarmaker.exe build-miner/sugarmaker.exe
          else
            cp sugarmaker build-miner/sugarmaker
          fi

          echo "============================================================"
          echo "Miner built successfully"
          echo "============================================================"

          file build-miner/* || true
          ls -lh build-miner/


      # ======================================================================
      # WINDOWS DLL BUNDLE
      # ======================================================================

      - name: Bundle Windows DLLs
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -e

          mkdir -p build-miner

          cp sugarmaker.exe build-miner/

          if [ "${{ matrix.arch }}" = "x86_64" ]; then

            DLL_DIR="/mingw64/bin"

          elif [ "${{ matrix.arch }}" = "arm64" ]; then

            DLL_DIR="/clangarm64/bin"

          else

            exit 0

          fi

          ldd sugarmaker.exe \
            | grep "$DLL_DIR" \
            | awk '{print $3}' \
            | sort -u \
            | while read dll; do
                [ -f "$dll" ] && cp "$dll" build-miner/
              done

          echo "Bundled Windows runtime libraries:"
          ls -lh build-miner/


      # ======================================================================
      # INSTALL LINUX GUI DEPENDENCIES
      # ======================================================================

      - name: Install GUI dependencies - Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "Installing Linux GUI dependencies"
          echo "Target:       ${{ matrix.rust_target }}"
          echo "Architecture: ${{ matrix.arch }}"
          echo "Native:       ${{ matrix.native }}"
          echo "============================================================"

          # ---------------------------------------------------------------
          # Enable i386 repository support.
          #
          # This is harmless for native/other targets and is required for
          # the i686 GUI build.
          # ---------------------------------------------------------------

          sudo dpkg --add-architecture i386 || true

          sudo apt-get update


          # ---------------------------------------------------------------
          # Native Linux GUI
          # ---------------------------------------------------------------

          if [ "${{ matrix.native }}" = "true" ]; then

            echo "Installing native GUI dependencies..."

            sudo apt-get install -y \
              pkg-config \
              libglib2.0-dev \
              libgtk-3-dev \
              libwebkit2gtk-4.1-dev \
              libjavascriptcoregtk-4.1-dev \
              libsoup-3.0-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf

            echo "============================================================"
            echo "Native GUI dependencies installed"
            echo "============================================================"

            pkg-config --modversion glib-2.0
            pkg-config --modversion gtk+-3.0
            pkg-config --modversion webkit2gtk-4.1

            exit 0
          fi


          # ---------------------------------------------------------------
          # Cross compilation
          # ---------------------------------------------------------------

          echo "Configuring cross-compilation GUI environment..."


          case "${{ matrix.arch }}" in

            # =============================================================
            # i686
            # =============================================================

            i686)

              echo "Installing i686 GUI dependencies..."

              sudo apt-get install -y \
                pkg-config \
                gcc-i686-linux-gnu \
                g++-i686-linux-gnu \
                libglib2.0-dev:i386 \
                libgtk-3-dev:i386 \
                libwebkit2gtk-4.1-dev:i386 \
                libjavascriptcoregtk-4.1-dev:i386 \
                libsoup-3.0-dev:i386 \
                libappindicator3-dev:i386 \
                librsvg2-dev:i386 \
                patchelf

              # -----------------------------------------------------------
              # Tell pkg-config that this is a cross compilation.
              # -----------------------------------------------------------

              export PKG_CONFIG_ALLOW_CROSS=1

              export PKG_CONFIG_SYSROOT_DIR="/"

              export PKG_CONFIG_LIBDIR="/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig"

              export PKG_CONFIG_PATH=""

              # -----------------------------------------------------------
              # Configure Cargo linker.
              # -----------------------------------------------------------

              export CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER="i686-linux-gnu-gcc"

              ;;


            # =============================================================
            # ARMv7
            # =============================================================

            armv7l)

              echo "Installing ARMv7 GUI dependencies..."

              sudo dpkg --add-architecture armhf || true
              sudo apt-get update

              sudo apt-get install -y \
                pkg-config \
                gcc-arm-linux-gnueabihf \
                g++-arm-linux-gnueabihf \
                libglib2.0-dev:armhf \
                libgtk-3-dev:armhf \
                libwebkit2gtk-4.1-dev:armhf \
                libjavascriptcoregtk-4.1-dev:armhf \
                libsoup-3.0-dev:armhf \
                libappindicator3-dev:armhf \
                librsvg2-dev:armhf \
                patchelf

              export PKG_CONFIG_ALLOW_CROSS=1

              export PKG_CONFIG_SYSROOT_DIR="/"

              export PKG_CONFIG_LIBDIR="/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig"

              export PKG_CONFIG_PATH=""

              export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER="arm-linux-gnueabihf-gcc"

              ;;


            # =============================================================
            # AArch64
            # =============================================================

            aarch64)

              echo "Installing AArch64 GUI dependencies..."

              sudo apt-get install -y \
                pkg-config \
                gcc-aarch64-linux-gnu \
                g++-aarch64-linux-gnu \
                libglib2.0-dev:arm64 \
                libgtk-3-dev:arm64 \
                libwebkit2gtk-4.1-dev:arm64 \
                libjavascriptcoregtk-4.1-dev:arm64 \
                libsoup-3.0-dev:arm64 \
                libappindicator3-dev:arm64 \
                librsvg2-dev:arm64 \
                patchelf

              export PKG_CONFIG_ALLOW_CROSS=1

              export PKG_CONFIG_SYSROOT_DIR="/"

              export PKG_CONFIG_LIBDIR="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"

              export PKG_CONFIG_PATH=""

              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="aarch64-linux-gnu-gcc"

              ;;


            # =============================================================
            # RISC-V64
            # =============================================================

            riscv64)

              echo "Installing RISC-V64 GUI dependencies..."

              sudo apt-get install -y \
                pkg-config \
                gcc-riscv64-linux-gnu \
                g++-riscv64-linux-gnu \
                libglib2.0-dev:riscv64 \
                libgtk-3-dev:riscv64 \
                libwebkit2gtk-4.1-dev:riscv64 \
                libjavascriptcoregtk-4.1-dev:riscv64 \
                libsoup-3.0-dev:riscv64 \
                libappindicator3-dev:riscv64 \
                librsvg2-dev:riscv64 \
                patchelf

              export PKG_CONFIG_ALLOW_CROSS=1

              export PKG_CONFIG_SYSROOT_DIR="/"

              export PKG_CONFIG_LIBDIR="/usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig"

              export PKG_CONFIG_PATH=""

              export CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER="riscv64-linux-gnu-gcc"

              ;;


            *)

              echo "Unsupported Linux GUI architecture:"
              echo "${{ matrix.arch }}"
              exit 1

              ;;

          esac


          # ---------------------------------------------------------------
          # Persist pkg-config configuration for the GUI build steps.
          # ---------------------------------------------------------------

          {
            echo "PKG_CONFIG_ALLOW_CROSS=${PKG_CONFIG_ALLOW_CROSS}"
            echo "PKG_CONFIG_SYSROOT_DIR=${PKG_CONFIG_SYSROOT_DIR}"
            echo "PKG_CONFIG_LIBDIR=${PKG_CONFIG_LIBDIR}"
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}"
          } >> "$GITHUB_ENV"


          # ---------------------------------------------------------------
          # Persist Cargo linker configuration.
          # ---------------------------------------------------------------

          case "${{ matrix.arch }}" in

            i686)
              echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=i686-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;

            armv7l)
              echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
              ;;

            aarch64)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;

            riscv64)
              echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;

          esac


          # ---------------------------------------------------------------
          # Display final configuration.
          # ---------------------------------------------------------------

          echo "============================================================"
          echo "Linux GUI cross-compilation configuration"
          echo "============================================================"
          echo "Rust target:       ${{ matrix.rust_target }}"
          echo "Architecture:      ${{ matrix.arch }}"
          echo "PKG_CONFIG_ALLOW:  ${PKG_CONFIG_ALLOW_CROSS}"
          echo "PKG_CONFIG_SYSROOT: ${PKG_CONFIG_SYSROOT_DIR}"
          echo "PKG_CONFIG_LIBDIR: ${PKG_CONFIG_LIBDIR}"
          echo "PKG_CONFIG_PATH:   ${PKG_CONFIG_PATH}"
          echo "============================================================"


          # ---------------------------------------------------------------
          # Verify GLib is visible to pkg-config.
          #
          # This is the exact dependency that previously failed with:
          #
          # pkg-config has not been configured to support cross-compilation
          #
          # If this fails, Cargo/Tauri would fail later with glib-sys.
          # ---------------------------------------------------------------

          echo "Checking GLib..."

          pkg-config --modversion glib-2.0

          echo "Checking GTK..."

          pkg-config --modversion gtk+-3.0

          echo "Checking WebKitGTK..."

          pkg-config --modversion webkit2gtk-4.1

          echo "============================================================"
          echo "Linux GUI dependencies verified successfully"
          echo "============================================================"


      # ======================================================================
      # INSTALL GUI DEPENDENCIES - WINDOWS
      # ======================================================================

      - name: Prepare Windows GUI environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Preparing Windows GUI build environment"


      # ======================================================================
      # PUT MINER INTO TAURI RESOURCES
      # ======================================================================

      - name: Prepare GUI miner resource
        shell: bash
        run: |
          set -e

          mkdir -p gui/agent/src-tauri/binaries

          if [ "${{ matrix.platform }}" = "windows" ] || [ "${{ matrix.platform }}" = "win32-cross" ]; then

            cp build-miner/sugarmaker.exe \
              gui/agent/src-tauri/binaries/sugarmaker.exe

          else

            cp build-miner/sugarmaker \
              gui/agent/src-tauri/binaries/sugarmaker

          fi

          echo "============================================================"
          echo "GUI miner resource prepared"
          echo "============================================================"

          ls -lh gui/agent/src-tauri/binaries/


      # ======================================================================
      # INSTALL AGENT DEPENDENCIES
      # ======================================================================

      - name: Install agent frontend dependencies
        working-directory: gui/agent
        shell: bash
        run: |
          set -e
          npm install

      # ======================================================================
      # INSTALL DASHBOARD DEPENDENCIES
      # ======================================================================

      - name: Install dashboard frontend dependencies
        working-directory: gui/dashboard
        shell: bash
        run: |
          set -e
          npm install

      # ======================================================================
      # BUILD AGENT GUI
      # ======================================================================

      - name: Build Agent GUI
        working-directory: gui/agent
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "Building Sugarmaker Agent GUI"
          echo "Target: ${{ matrix.name }}"
          echo "Rust:   ${{ matrix.rust_target }}"
          echo "============================================================"

          npm run build

          npx tauri build \
            --target "${{ matrix.rust_target }}"


      # ======================================================================
      # BUILD DASHBOARD GUI
      # ======================================================================

      - name: Build Dashboard GUI
        working-directory: gui/dashboard
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "Building Sugarmaker Dashboard GUI"
          echo "Target: ${{ matrix.name }}"
          echo "Rust:   ${{ matrix.rust_target }}"
          echo "============================================================"

          npm run build

          npx tauri build \
            --target "${{ matrix.rust_target }}"


      # ======================================================================
      # COLLECT EVERYTHING
      # ======================================================================

      - name: Prepare final architecture bundle
        shell: bash
        run: |
          set -e

          mkdir -p dist

          # --------------------------------------------------------------
          # Miner
          # --------------------------------------------------------------

          mkdir -p dist/miner

          cp -r build-miner/* dist/miner/


          # --------------------------------------------------------------
          # Agent GUI
          # --------------------------------------------------------------

          if [ -d "gui/agent/src-tauri/target/${{ matrix.rust_target }}/release/bundle" ]; then
            mkdir -p dist/agent
            cp -r \
              "gui/agent/src-tauri/target/${{ matrix.rust_target }}/release/bundle/"* \
              dist/agent/ || true
          fi


          # --------------------------------------------------------------
          # Dashboard GUI
          # --------------------------------------------------------------

          if [ -d "gui/dashboard/src-tauri/target/${{ matrix.rust_target }}/release/bundle" ]; then
            mkdir -p dist/dashboard
            cp -r \
              "gui/dashboard/src-tauri/target/${{ matrix.rust_target }}/release/bundle/"* \
              dist/dashboard/ || true
          fi


          # --------------------------------------------------------------
          # Build information
          # --------------------------------------------------------------

          cat > dist/BUILD-INFO.txt <<EOF
          Sugarmaker Build
          ============================

          Target:
            ${{ matrix.name }}

          Platform:
            ${{ matrix.platform }}

          Architecture:
            ${{ matrix.arch }}

          Rust Target:
            ${{ matrix.rust_target }}

          Components:
            - Sugarmaker CPU Miner
            - Sugarmaker Agent GUI
            - Sugarmaker Dashboard GUI
          EOF


          echo "============================================================"
          echo "FINAL BUILD"
          echo "============================================================"

          find dist -maxdepth 3 -type f -print
          du -sh dist || true


      # ======================================================================
      # UPLOAD FINAL ARCHITECTURE
      # ======================================================================

      - name: Upload architecture bundle
        uses: actions/upload-artifact@v4
        with:
          name: sugarmaker-${{ matrix.name }}
          path: dist/**
          if-no-files-found: error