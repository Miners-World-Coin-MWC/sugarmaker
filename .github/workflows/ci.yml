name: Sugarmaker CI + GUI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'contrib/**'
      - '**/*.md'
  workflow_dispatch:

env:
  MAKEJOBS: "-j3"

jobs:

  # ========================================================================
  # BUILD MINER + GUI FOR EVERY TARGET
  # ========================================================================

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # ==================================================================
          # LINUX
          # ==================================================================

          - name: x86_64-linux
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            native: true
            rust_target: x86_64-unknown-linux-gnu

          - name: i686-linux
            os: ubuntu-22.04
            platform: linux
            arch: i686
            native: false
            cross_host: i686-linux-gnu
            rust_target: i686-unknown-linux-gnu
            # GUI can't cross-link webkit2gtk from an x86_64 host here -- see
            # the build-gui-i686-linux job at the bottom of this file, which
            # builds the GUI natively inside a linux/386 container instead.
            gui: false

          - name: armv7l-linux
            os: ubuntu-22.04
            platform: linux
            arch: armv7l
            native: false
            cross_host: arm-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            # GUI is built by the build-gui-qemu job at the bottom of this
            # file instead (needs real QEMU emulation, not cross-linking).
            gui: false

          - name: aarch64-linux
            os: ubuntu-22.04
            platform: linux
            arch: aarch64
            native: false
            cross_host: aarch64-linux-gnu
            rust_target: aarch64-unknown-linux-gnu
            # GUI is built by the build-gui-qemu job at the bottom of this
            # file instead (needs real QEMU emulation, not cross-linking).
            gui: false

          - name: aarch64-linux-native
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            native: true
            rust_target: aarch64-unknown-linux-gnu

          - name: riscv64-linux
            os: ubuntu-22.04
            platform: linux
            arch: riscv64
            native: false
            cross_host: riscv64-linux-gnu
            rust_target: riscv64gc-unknown-linux-gnu
            # GUI is built by the build-gui-qemu job at the bottom of this
            # file instead (needs real QEMU emulation, not cross-linking).
            gui: false

          # ==================================================================
          # MACOS
          # ==================================================================

          - name: x86_64-macos
            os: macos-15-intel
            platform: macos
            arch: x86_64
            host: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin

          - name: arm64-macos
            os: macos-latest
            platform: macos
            arch: arm64
            host: arm64-apple-darwin
            rust_target: aarch64-apple-darwin

          # ==================================================================
          # WINDOWS
          # ==================================================================

          - name: x86_64-win
            os: windows-latest
            platform: windows
            arch: x86_64
            native: true
            msystem: MINGW64
            rust_target: x86_64-pc-windows-msvc

          - name: i686-win
            os: ubuntu-22.04
            platform: win32-cross
            arch: i686
            native: false
            rust_target: i686-pc-windows-gnu

          - name: arm64-win
            os: windows-11-arm
            platform: windows
            arch: arm64
            native: true
            msystem: CLANGARM64
            rust_target: aarch64-pc-windows-msvc


    steps:

      # ======================================================================
      # CHECKOUT
      # ======================================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================================
      # NODE
      # ======================================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ======================================================================
      # RUST
      # ======================================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}


      # ======================================================================
      # LINUX NATIVE DEPENDENCIES
      # ======================================================================

      - name: Install Linux native dependencies
        if: matrix.platform == 'linux' && matrix.native == true
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libcurl4-openssl-dev \
            libjansson-dev \
            libssl-dev \
            libgmp-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf


      # ======================================================================
      # LINUX CROSS TOOLCHAINS
      # ======================================================================

      - name: Install Linux cross toolchain
        if: matrix.platform == 'linux' && matrix.native == false
        shell: bash
        run: |
          set -e

          sudo apt-get update

          case "${{ matrix.arch }}" in

            i686)
              sudo dpkg --add-architecture i386
              sudo apt-get update

              sudo apt-get install -y \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gcc-multilib \
                g++-multilib \
                libcurl4-openssl-dev:i386 \
                libwebkit2gtk-4.1-dev \
                libappindicator3-dev \
                librsvg2-dev \
                patchelf
              ;;

            armv7l)
              sudo apt-get install -y \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gcc-arm-linux-gnueabihf \
                g++-arm-linux-gnueabihf \
                libwebkit2gtk-4.1-dev \
                libappindicator3-dev \
                librsvg2-dev \
                patchelf
              ;;

            aarch64)
              sudo apt-get install -y \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gcc-aarch64-linux-gnu \
                g++-aarch64-linux-gnu \
                libwebkit2gtk-4.1-dev \
                libappindicator3-dev \
                librsvg2-dev \
                patchelf
              ;;

            riscv64)
              sudo apt-get install -y \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gcc-riscv64-linux-gnu \
                g++-riscv64-linux-gnu \
                libwebkit2gtk-4.1-dev \
                libappindicator3-dev \
                librsvg2-dev \
                patchelf
              ;;

            *)
              echo "Unsupported architecture: ${{ matrix.arch }}"
              exit 1
              ;;
          esac


      # ======================================================================
      # LINUX CROSS CURL
      # ======================================================================

      - name: Build static libcurl for Linux cross target
        if: matrix.platform == 'linux' && matrix.native == false && matrix.arch != 'i686'
        shell: bash
        run: |
          set -e

          CURL_VERSION=8.19.0
          CURL_PACKAGE="curl-${CURL_VERSION}"
          CURL_PACKAGE_FILE="${CURL_PACKAGE}.tar.gz"
          CURL_PREFIX="${PWD}/curl-cross-${{ matrix.arch }}"

          case "${{ matrix.arch }}" in

            armv7l)
              HOST="arm-linux-gnueabihf"

              export CC="${HOST}-gcc"
              export CXX="${HOST}-g++"
              export AR="${HOST}-ar"
              export RANLIB="${HOST}-ranlib"
              export STRIP="${HOST}-strip"

              export CFLAGS="-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"
              export CXXFLAGS="${CFLAGS}"
              ;;

            aarch64)
              HOST="aarch64-linux-gnu"

              export CC="${HOST}-gcc"
              export CXX="${HOST}-g++"
              export AR="${HOST}-ar"
              export RANLIB="${HOST}-ranlib"
              export STRIP="${HOST}-strip"

              export CFLAGS="-march=armv8-a"
              export CXXFLAGS="${CFLAGS}"
              ;;

            riscv64)
              HOST="riscv64-linux-gnu"

              export CC="${HOST}-gcc"
              export CXX="${HOST}-g++"
              export AR="${HOST}-ar"
              export RANLIB="${HOST}-ranlib"
              export STRIP="${HOST}-strip"

              export CFLAGS="-march=rv64gc -mabi=lp64d"
              export CXXFLAGS="${CFLAGS}"
              ;;

          esac

          wget -q \
            "https://curl.se/download/${CURL_PACKAGE_FILE}" \
            -O "${CURL_PACKAGE_FILE}"

          tar xzf "${CURL_PACKAGE_FILE}"

          cd "${CURL_PACKAGE}"

          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_LIBDIR=""
          export PKG_CONFIG_ALLOW_CROSS=1

          ./configure \
            --build=x86_64-pc-linux-gnu \
            --host="${HOST}" \
            --prefix="${CURL_PREFIX}" \
            --disable-shared \
            --enable-static \
            --without-ssl \
            --without-zlib \
            --without-brotli \
            --without-zstd \
            --without-libidn2 \
            --without-libpsl \
            --without-nghttp2 \
            --without-nghttp3 \
            --without-ngtcp2 \
            --without-quiche \
            --without-libssh2 \
            --without-librtmp \
            --disable-ldap \
            --disable-ldaps \
            --disable-rtsp \
            --disable-dict \
            --disable-telnet \
            --disable-tftp \
            --disable-pop3 \
            --disable-imap \
            --disable-smtp \
            --disable-gopher \
            --disable-mqtt \
            --disable-unix-sockets

          make ${MAKEJOBS}
          make install

          cd ..

          echo "CURL_PREFIX=${CURL_PREFIX}" >> "$GITHUB_ENV"

          test -f "${CURL_PREFIX}/lib/libcurl.a"
          test -f "${CURL_PREFIX}/include/curl/curl.h"


      # ======================================================================
      # BUILD MINER - LINUX NATIVE
      # ======================================================================

      - name: Build Sugarmaker - Linux native
        if: matrix.platform == 'linux' && matrix.native == true
        shell: bash
        run: |
          set -e

          ./autogen.sh || true

          ./configure \
            --with-curl

          make ${MAKEJOBS}


      # ======================================================================
      # BUILD MINER - LINUX CROSS
      # ======================================================================

      - name: Build Sugarmaker - Linux cross
        if: matrix.platform == 'linux' && matrix.native == false
        shell: bash
        run: |
          set -e

          ./autogen.sh || true

          HOST="${{ matrix.cross_host }}"

          export CC="${HOST}-gcc"
          export CXX="${HOST}-g++"
          export AR="${HOST}-ar"
          export RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip"

          if [ "${{ matrix.arch }}" = "i686" ]; then

            export CC="gcc"
            export CXX="g++"

            unset AR
            unset RANLIB
            unset STRIP

            export CFLAGS="-m32"
            export CXXFLAGS="-m32"
            export LDFLAGS="-m32"

            export PKG_CONFIG_PATH=""
            export PKG_CONFIG_LIBDIR="/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig"
            export PKG_CONFIG_ALLOW_CROSS=1

            ./configure \
              --host="${HOST}" \
              --with-curl

            make ${MAKEJOBS}

            exit 0
          fi

          case "${{ matrix.arch }}" in

            armv7l)
              export CFLAGS="-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"
              export CXXFLAGS="${CFLAGS}"
              ;;

            aarch64)
              export CFLAGS="-march=armv8-a"
              export CXXFLAGS="${CFLAGS}"
              ;;

            riscv64)
              export CFLAGS="-march=rv64gc -mabi=lp64d"
              export CXXFLAGS="${CFLAGS}"
              ;;

          esac

          ./configure \
            --host="${HOST}" \
            --with-curl="${CURL_PREFIX}" \
            CFLAGS="${CFLAGS}" \
            CXXFLAGS="${CXXFLAGS}" \
            LDFLAGS="-static"

          make ${MAKEJOBS}


      # ======================================================================
      # MACOS DEPENDENCIES
      # ======================================================================

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -e

          brew install \
            automake \
            autoconf \
            libtool \
            pkg-config \
            curl \
            jansson \
            openssl \
            gmp || true


      # ======================================================================
      # BUILD MINER - MACOS
      # ======================================================================

      - name: Build Sugarmaker - macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -e

          ./autogen.sh || true

          BREW_PREFIX="$(brew --prefix)"

          export CPPFLAGS="-I${BREW_PREFIX}/include"
          export LDFLAGS="-L${BREW_PREFIX}/lib"

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            export CFLAGS="-arch x86_64"
            export CXXFLAGS="-arch x86_64"
          else
            export CFLAGS="-arch arm64"
            export CXXFLAGS="-arch arm64"
          fi

          ./configure \
            --with-curl \
            --host="${{ matrix.host }}"

          make ${MAKEJOBS}


      # ======================================================================
      # WINDOWS i686 CROSS TOOLCHAIN
      # ======================================================================

      - name: Install Windows i686 toolchain
        if: matrix.platform == 'win32-cross'
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            gcc-mingw-w64-i686-posix \
            g++-mingw-w64-i686-posix \
            binutils-mingw-w64-i686 \
            mingw-w64-i686-dev \
            mingw-w64-common \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            git \
            wget \
            file \
            nsis


      # ======================================================================
      # WINDOWS i686 DEPENDENCIES
      # ======================================================================

      - name: Build Windows i686 dependencies
        if: matrix.platform == 'win32-cross'
        shell: bash
        run: |
          set -e

          cd depends/deps-win32

          chmod +x build_win_x86_deps.sh
          ./build_win_x86_deps.sh

          cd ../..

          echo "CURL_PREFIX=${PWD}/depends/deps-win32/i686-w64-mingw32" >> "$GITHUB_ENV"


      # ======================================================================
      # BUILD WINDOWS i686
      # ======================================================================

      - name: Build Sugarmaker - Windows i686
        if: matrix.platform == 'win32-cross'
        shell: bash
        run: |
          set -e

          export HOST="i686-w64-mingw32"

          export CC="i686-w64-mingw32-gcc-posix"
          export CXX="i686-w64-mingw32-g++-posix"
          export AR="i686-w64-mingw32-ar"
          export RANLIB="i686-w64-mingw32-ranlib"
          export STRIP="i686-w64-mingw32-strip"

          CURL_PREFIX="${PWD}/depends/deps-win32/i686-w64-mingw32"

          export CFLAGS="-Wall -O2 -fomit-frame-pointer -std=c99 -DWIN32 -D_WIN32_WINNT=0x0600 -DCURL_STATICLIB -DPTW32_STATIC_LIB"
          export CXXFLAGS="-Wall -O2 -fomit-frame-pointer -DWIN32 -D_WIN32_WINNT=0x0600 -DCURL_STATICLIB -DPTW32_STATIC_LIB"
          export CPPFLAGS="-I${CURL_PREFIX}/include"
          export LDFLAGS="-static -L${CURL_PREFIX}/lib"

          ./autogen.sh || true

          autoreconf -fi \
            -I"${CURL_PREFIX}/share/aclocal"

          export LIBS="-lcurl -lws2_32 -lcrypt32 -lsecur32 -lwldap32 -lbcrypt -liphlpapi -lwinpthread"

          ./configure \
            --build=x86_64-pc-linux-gnu \
            --host="${HOST}" \
            --with-curl="${CURL_PREFIX}" \
            CPPFLAGS="${CPPFLAGS}" \
            CFLAGS="${CFLAGS}" \
            CXXFLAGS="${CXXFLAGS}" \
            LDFLAGS="${LDFLAGS}" \
            LIBS="${LIBS}"

          make ${MAKEJOBS}

          "${STRIP}" \
            -p \
            --strip-debug \
            --strip-unneeded \
            sugarmaker.exe


      # ======================================================================
      # WINDOWS MSYS2
      # ======================================================================

      - name: Setup MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{ matrix.msystem }}
          install: >
            base-devel
            autoconf
            automake
            libtool
            pkg-config


      # ======================================================================
      # WINDOWS x86_64 DEPENDENCIES
      # ======================================================================

      - name: Install Windows x86_64 dependencies
        if: matrix.platform == 'windows' && matrix.arch == 'x86_64'
        shell: msys2 {0}
        run: |
          set -e

          pacman -S --noconfirm \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-curl \
            mingw-w64-x86_64-jansson \
            mingw-w64-x86_64-openssl \
            mingw-w64-x86_64-gmp


      # ======================================================================
      # WINDOWS ARM64 DEPENDENCIES
      # ======================================================================

      - name: Install Windows ARM64 dependencies
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: msys2 {0}
        run: |
          set -e

          pacman -S --noconfirm \
            mingw-w64-clang-aarch64-toolchain \
            mingw-w64-clang-aarch64-curl \
            mingw-w64-clang-aarch64-jansson \
            mingw-w64-clang-aarch64-openssl \
            mingw-w64-clang-aarch64-gmp


      # ======================================================================
      # BUILD WINDOWS
      # ======================================================================

      - name: Build Sugarmaker - Windows
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -e

          ./autogen.sh || true

          ./configure \
            --with-curl

          make ${MAKEJOBS}


      # ======================================================================
      # NORMALIZE MINER BINARY
      # ======================================================================

      - name: Prepare miner binary
        shell: bash
        run: |
          set -e

          mkdir -p build-miner

          if [ "${{ matrix.platform }}" = "windows" ] || [ "${{ matrix.platform }}" = "win32-cross" ]; then
            cp sugarmaker.exe build-miner/sugarmaker.exe
          else
            cp sugarmaker build-miner/sugarmaker
          fi

          echo "============================================================"
          echo "Miner built successfully"
          echo "============================================================"

          file build-miner/* || true
          ls -lh build-miner/


      # ======================================================================
      # WINDOWS DLL BUNDLE
      # ======================================================================

      - name: Bundle Windows DLLs
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -e

          mkdir -p build-miner

          cp sugarmaker.exe build-miner/

          if [ "${{ matrix.arch }}" = "x86_64" ]; then

            DLL_DIR="/mingw64/bin"

          elif [ "${{ matrix.arch }}" = "arm64" ]; then

            DLL_DIR="/clangarm64/bin"

          else

            exit 0

          fi

          ldd sugarmaker.exe \
            | grep "$DLL_DIR" \
            | awk '{print $3}' \
            | sort -u \
            | while read dll; do
                [ -f "$dll" ] && cp "$dll" build-miner/
              done

          echo "Bundled Windows runtime libraries:"
          ls -lh build-miner/


      # ======================================================================
      # INSTALL LINUX GUI DEPENDENCIES
      # ======================================================================

      - name: Install GUI dependencies - Linux
        if: runner.os == 'Linux' && matrix.gui != false
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf


      # ======================================================================
      # INSTALL GUI DEPENDENCIES - WINDOWS
      # ======================================================================

      - name: Prepare Windows GUI environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Preparing Windows GUI build environment"


      # ======================================================================
      # PUT MINER INTO TAURI RESOURCES
      # ======================================================================

      - name: Prepare GUI miner resource
        shell: bash
        run: |
          set -e

          mkdir -p gui/agent/src-tauri/binaries

          if [ "${{ matrix.platform }}" = "windows" ] || [ "${{ matrix.platform }}" = "win32-cross" ]; then

            cp build-miner/sugarmaker.exe \
              gui/agent/src-tauri/binaries/sugarmaker.exe

          else

            cp build-miner/sugarmaker \
              gui/agent/src-tauri/binaries/sugarmaker

          fi

          echo "============================================================"
          echo "GUI miner resource prepared"
          echo "============================================================"

          ls -lh gui/agent/src-tauri/binaries/


      # ======================================================================
      # INSTALL AGENT DEPENDENCIES
      # ======================================================================

      - name: Install agent frontend dependencies
        if: matrix.gui != false
        working-directory: gui/agent
        shell: bash
        run: |
          set -e
          npm install

      # ======================================================================
      # INSTALL DASHBOARD DEPENDENCIES
      # ======================================================================

      - name: Install dashboard frontend dependencies
        if: matrix.gui != false
        working-directory: gui/dashboard
        shell: bash
        run: |
          set -e
          npm install


      # ======================================================================
      # BUILD AGENT GUI
      # ======================================================================

      - name: Build Agent GUI
        if: matrix.gui != false
        working-directory: gui/agent
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "Building Sugarmaker Agent GUI"
          echo "Target: ${{ matrix.name }}"
          echo "Rust:   ${{ matrix.rust_target }}"
          echo "============================================================"

          npm run build

          npx tauri build \
            --target "${{ matrix.rust_target }}"


      # ======================================================================
      # BUILD DASHBOARD GUI
      # ======================================================================

      - name: Build Dashboard GUI
        if: matrix.gui != false
        working-directory: gui/dashboard
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "Building Sugarmaker Dashboard GUI"
          echo "Target: ${{ matrix.name }}"
          echo "Rust:   ${{ matrix.rust_target }}"
          echo "============================================================"

          npm run build

          npx tauri build \
            --target "${{ matrix.rust_target }}"


      # ======================================================================
      # COLLECT EVERYTHING
      # ======================================================================

      - name: Prepare final architecture bundle
        shell: bash
        run: |
          set -e

          mkdir -p dist

          # --------------------------------------------------------------
          # Miner
          # --------------------------------------------------------------

          mkdir -p dist/miner

          cp -r build-miner/* dist/miner/


          # --------------------------------------------------------------
          # Agent GUI
          # --------------------------------------------------------------

          if [ -d "gui/agent/src-tauri/target/${{ matrix.rust_target }}/release/bundle" ]; then
            mkdir -p dist/agent
            cp -r \
              "gui/agent/src-tauri/target/${{ matrix.rust_target }}/release/bundle/"* \
              dist/agent/ || true
          fi


          # --------------------------------------------------------------
          # Dashboard GUI
          # --------------------------------------------------------------

          if [ -d "gui/dashboard/src-tauri/target/${{ matrix.rust_target }}/release/bundle" ]; then
            mkdir -p dist/dashboard
            cp -r \
              "gui/dashboard/src-tauri/target/${{ matrix.rust_target }}/release/bundle/"* \
              dist/dashboard/ || true
          fi


          # --------------------------------------------------------------
          # Build information
          # --------------------------------------------------------------

          cat > dist/BUILD-INFO.txt <<EOF
          Sugarmaker Build
          ============================

          Target:
            ${{ matrix.name }}

          Platform:
            ${{ matrix.platform }}

          Architecture:
            ${{ matrix.arch }}

          Rust Target:
            ${{ matrix.rust_target }}

          Components:
            - Sugarmaker CPU Miner
            - Sugarmaker Agent GUI
            - Sugarmaker Dashboard GUI
          EOF


          echo "============================================================"
          echo "FINAL BUILD"
          echo "============================================================"

          find dist -maxdepth 3 -type f -print
          du -sh dist || true


      # ======================================================================
      # UPLOAD FINAL ARCHITECTURE
      # ======================================================================

      - name: Upload architecture bundle
        uses: actions/upload-artifact@v4
        with:
          name: sugarmaker-${{ matrix.name }}
          path: dist/**
          if-no-files-found: error


  # ==========================================================================
  # GUI FOR GTK-CROSS-BLOCKED LINUX TARGETS (i686, armv7l, aarch64, riscv64)
  # ==========================================================================
  # These four can't cross-link webkit2gtk from an x86_64 host -- there's no
  # foreign-arch libwebkit2gtk-4.1-dev package to point pkg-config at (the
  # build job above still cross-compiles the CLI miner for these fine; only
  # the GUI needed this). Instead of cross-linking, these jobs run the actual
  # build natively inside an emulated container of that architecture, so
  # `apt install libwebkit2gtk-4.1-dev` installs the real, correct-arch
  # package and cargo/npm just see a normal native host -- same GUI, same
  # bundle format, as every other platform gets from the build job above.
  #
  # i686 doesn't need real emulation -- 32-bit x86 code runs directly on the
  # amd64 runner CPU, so that variant uses a plain linux/386 container (fast,
  # no QEMU). armv7l/aarch64/riscv64 genuinely need QEMU, via
  # uraimo/run-on-arch-action, and are correspondingly much slower.

  build-gui-i686-linux:
    name: gui (i686-linux, native 32-bit container)
    needs: build
    runs-on: ubuntu-22.04
    container:
      image: i386/ubuntu:22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download miner binary from the build job
        uses: actions/download-artifact@v4
        with:
          name: sugarmaker-i686-linux
          path: downloaded

      - name: Install toolchain + GUI deps (native i386 packages)
        shell: bash
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libssl-dev patchelf file git

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Place miner binary in GUI resources
        shell: bash
        run: |
          set -e
          mkdir -p gui/agent/src-tauri/binaries
          cp downloaded/miner/sugarmaker gui/agent/src-tauri/binaries/sugarmaker
          chmod +x gui/agent/src-tauri/binaries/sugarmaker

      - name: Build agent + dashboard GUI (native in-container)
        shell: bash
        run: |
          set -e
          export PATH="$HOME/.cargo/bin:$PATH"

          cd gui/agent
          npm install
          npm run build
          npx tauri build
          cd ../dashboard
          npm install
          npm run build
          npx tauri build

      - name: Collect artifact
        shell: bash
        run: |
          set -e
          mkdir -p dist/agent dist/dashboard
          cp -r gui/agent/src-tauri/target/release/bundle/* dist/agent/ || true
          cp -r gui/dashboard/src-tauri/target/release/bundle/* dist/dashboard/ || true
          cp -r downloaded/miner dist/miner

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sugarmaker-gui-i686-linux
          path: dist/**
          if-no-files-found: warn

  build-gui-qemu:
    name: gui (${{ matrix.name }}, QEMU)
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armv7l-linux
            artifact_name: sugarmaker-armv7l-linux
            qemu_arch: armv7
            qemu_distro: ubuntu22.04

          - name: aarch64-linux
            artifact_name: sugarmaker-aarch64-linux
            qemu_arch: aarch64
            qemu_distro: ubuntu22.04

          - name: riscv64-linux
            artifact_name: sugarmaker-riscv64-linux
            qemu_arch: riscv64
            qemu_distro: ubuntu22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download miner binary from the build job
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: downloaded

      - name: Build inside emulated ${{ matrix.qemu_arch }} container
        uses: uraimo/run-on-arch-action@v2
        id: build
        with:
          arch: ${{ matrix.qemu_arch }}
          distro: ${{ matrix.qemu_distro }}
          githubToken: ${{ github.token }}

          # Bind-mount the checked-out repo + downloaded miner binary into
          # the emulated container at the same paths the run: script uses.
          dockerRunArgs: |
            --volume "${PWD}:/workspace"

          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends \
              curl ca-certificates build-essential pkg-config \
              libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
              libssl-dev patchelf file git

            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable

            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -q -y nodejs

          run: |
            set -e
            export PATH="$HOME/.cargo/bin:$PATH"
            cd /workspace

            mkdir -p gui/agent/src-tauri/binaries
            cp downloaded/miner/sugarmaker gui/agent/src-tauri/binaries/sugarmaker
            chmod +x gui/agent/src-tauri/binaries/sugarmaker

            cd gui/agent
            npm install
            npm run build
            npx tauri build
            cd ../dashboard
            npm install
            npm run build
            npx tauri build

      - name: Collect artifact
        shell: bash
        run: |
          set -e
          mkdir -p dist/agent dist/dashboard
          cp -r gui/agent/src-tauri/target/release/bundle/* dist/agent/ || true
          cp -r gui/dashboard/src-tauri/target/release/bundle/* dist/dashboard/ || true
          cp -r downloaded/miner dist/miner

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sugarmaker-gui-${{ matrix.name }}
          path: dist/**
          if-no-files-found: warn